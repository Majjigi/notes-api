<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  [attr.width]="size()"
  [attr.height]="size()"
  [attr.stroke-width]="strokeWidth()"
>
  @for (d of paths(); track $index) {
    <path [attr.d]="d" />
  }
</svg>
